name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        modules: 'qtbase qttools qttranslations'
        cached: 'true'
    
    - name: Setup CMake
      uses: lukka/run-cmake@v5
      with:
        cmakeListsTxtPath: '${{ github.workspace }}/CMakeLists.txt'
        buildDirectory: '${{ github.workspace }}/build'
        buildType: 'Release'
    
    - name: Build Application
      run: |
        cd build
        cmake --build . --config Release
    
    - name: Create Windows Package
      run: |
        mkdir -p dist/PSIO-Assist-EX
        copy build\Release\psio-assist.exe dist\PSIO-Assist-EX\
        copy translations\*.qm dist\PSIO-Assist-EX\translations\
        copy README.md dist\PSIO-Assist-EX\
        copy LICENSE dist\PSIO-Assist-EX\
        
        # Deploy Qt dependencies
        $env:QT_DIR = "${{ runner.temp }}/Qt/6.5.0/mingw_64"
        & "$env:QT_DIR/bin/windeployqt.exe" dist\PSIO-Assist-EX\psio-assist.exe
    
    - name: Download and Install NSIS
      run: |
        Invoke-WebRequest -Uri "https://nsis.sourceforge.io/mediawiki/images/4/4a/NSIS_3.08_setup.exe" -OutFile "nsis-installer.exe"
        Start-Process -FilePath "nsis-installer.exe" -ArgumentList "/S" -Wait
        # Wait a bit for installation to complete
        Start-Sleep -Seconds 10
    
    - name: Create Installer
      run: |
        # Check if NSIS is installed
        if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
          "C:\Program Files (x86)\NSIS\makensis.exe" installer\psio-assist-installer.nsi
        } else {
          Write-Error "NSIS not found at expected location"
          exit 1
        }
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: |
          PSIO-Assist-EX-Installer.exe
          dist/PSIO-Assist-EX/
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          PSIO-Assist-EX-Installer.exe
        draft: false
        prerelease: false
